name: Build network extracts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1" # weekly, Monday 02:17 UTC

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install osmium
        run: pip install osmium
      - name: Download Geofabrik Philippines
        run: curl -sL -o ph.osm.pbf https://download.geofabrik.de/asia/philippines-latest.osm.pbf
      - name: Build cells
        run: python build_cells.py ph.osm.pbf cells geofabrik-philippines
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view extracts >/dev/null 2>&1 || gh release create extracts --title "Network extracts" --notes "Pre-built street-network cells. (c) OpenStreetMap contributors, ODbL 1.0."
          gh release upload extracts cells/* --clobber

  overture:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install overturemaps CLI
        run: pip install overturemaps
      - name: Download Overture segments (Metro Manila bbox)
        run: overturemaps download --bbox=120.85,14.20,121.25,14.95 -f geojson --type=segment -o overture_segments.geojson
      - name: Build cells
        run: python overture_to_cells.py overture_segments.geojson overture_cells
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view extracts-overture >/dev/null 2>&1 || gh release create extracts-overture --title "Network extracts (Overture)" --notes "Experimental alternate source. (c) Overture Maps Foundation; OSM-derived portions ODbL."
          gh release upload extracts-overture overture_cells/* --clobber
